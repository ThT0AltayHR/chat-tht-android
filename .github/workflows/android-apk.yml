name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create dummy google-services.json
        run: |
          cp app/google-services.json.example app/google-services.json || \
          cat > app/google-services.json << 'GEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "chat-tht",
              "storage_bucket": "chat-tht.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.turkhackteam.org"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "placeholder" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          GEOF

      - name: Create dummy stoatbuild.properties
        run: |
          cat > stoatbuild.properties << 'EOF'
          sentry.dsn=
          build.flavour_id=community
          build.debug.app_name=Chat THT Debug
          EOF

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName = "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-build-$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/ChatTHT-v${{ steps.version.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Chat THT v${{ steps.version.outputs.version }}"
          body: |
            ## Chat THT Android — v${{ steps.version.outputs.version }}

            TurkHackTeam topluluğu için Revolt tabanlı sohbet uygulaması.

            ### İndirme
            Aşağıdaki **Assets** bölümünden APK dosyasını indirin.

            > Geliştirici: **AltayHR** | Topluluk: [turkhackteam.org](https://www.turkhackteam.org)
          files: app/build/outputs/apk/debug/ChatTHT-v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
